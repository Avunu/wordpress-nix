version: 2

# Keeps every ecosystem in this repo up to date, flake.lock included. PRs auto-merge
# once the required checks go green — see .github/workflows/dependabot-auto-merge.yml.
updates:
  # GitHub Actions used by the workflows in .github/workflows.
  #
  # Dependabot only scans the repo-root .github/workflows, so the site caller template
  # in templates/site/.github/workflows/publish.yml is *not* covered — it is scaffolding
  # copied into site repos (which get their own Dependabot), and its only pin is the
  # Avunu/wordpress-nix reusable workflow ref. Bump that by hand when the pipeline moves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]

  # Nix flake inputs — nixpkgs, flake-utils, and the pinned
  # wordpress-sqlite-anywhere plugin. Dependabot reads flake.lock directly
  # (schema v7) and covers the `git+https` plugin input as well as the `github:` ones.
  #
  # A lock bump touches flake.lock, so these PRs run the image build (oci).
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nix:
        patterns: ["*"]

  # The documentation site (docs-site/): @avunu/docusystem and the packages it brings. A person reviews
  # these pull requests: a merge to the default branch publishes the site (see the auto-merge workflow, if any).
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "@avunu/docusystem"
    groups:
      docs-site-packages:
        patterns: ["*"]
    commit-message:
      prefix: chore
