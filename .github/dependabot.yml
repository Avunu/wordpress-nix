version: 2

# Keeps every ecosystem in this repo up to date, flake.lock included. PRs auto-merge
# once the required checks go green — see .github/workflows/dependabot-auto-merge.yml.
updates:
  # GitHub Actions used by the workflows in .github/workflows.
  #
  # Dependabot only scans the repo-root .github/workflows, so the site caller template
  # in templates/site/.github/workflows/deploy.yml is *not* covered — it is scaffolding
  # copied into site repos (which get their own Dependabot), and its only pin is the
  # Avunu/wordpress reusable workflow ref. Bump that by hand when the pipeline moves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]

  # The platform edge Worker (worker/package.json + worker/package-lock.json).
  # Bumps here trigger the `worker` workflow, which runs the vitest suite.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns: ["*"]

  # Nix flake inputs — nixpkgs, flake-utils, and the pinned
  # sqlite-database-integration D1 driver. Dependabot reads flake.lock directly
  # (schema v7) and covers the `git+https` driver input as well as the `github:` ones.
  #
  # A lock bump touches flake.lock, which is in the `worker` workflow's path filter, so
  # these PRs run the worker suite as well as the image build.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nix:
        patterns: ["*"]
