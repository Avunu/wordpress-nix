version: 2

# Keeps every ecosystem in this repo up to date, flake.lock included. PRs, action bumps
# included, auto-merge once the required checks go green and are kept up to date with
# main — see .github/workflows/dependabot-auto-merge.yml.
updates:
  # GitHub Actions used by the workflows in .github/workflows.
  #
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]

  # Nix flake inputs: nixpkgs, flake-parts, devenv, python-devops-nix and the
  # Bedrock tag (the bedrock-template check holds the template to it).
  # Dependabot reads flake.lock directly (schema v7).
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nix:
        patterns: ["*"]
