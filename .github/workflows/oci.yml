name: Build and Push WordPress Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # magic-nix-cache scopes its GitHub Actions cache entries with this.
      id-token: write

    steps:
    - uses: actions/checkout@v7

    # `determinate: false` installs upstream Nix, not Determinate's distribution.
    # The flake's nixConfig is accepted for the same reason as in checks.yml.
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        determinate: false
        extra-conf: |
          accept-flake-config = true

    # Backs /nix/store with the GitHub Actions cache, so unchanged derivations are not rebuilt
    # across runs. `use-flakehub: false`: this repo is not a FlakeHub flake.
    - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-flakehub: false

    - name: Build Docker Images
      run: |
        nix build .#wordpress-php82 .#wordpress-php83 .#wordpress-php84 .#wordpress-php85
        for image in result result-*; do
          docker load < "$image"
        done

    # Publish only from `main`. On a pull_request the build above is the whole point —
    # a PR must never overwrite the `latest` tag, and Dependabot PRs run with a
    # read-only GITHUB_TOKEN (no `packages: write`), so pushing there would fail the
    # check and block auto-merge.
    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push'
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push images to GitHub Container Registry
      if: github.event_name == 'push'
      run: |
        IMAGE_ID=ghcr.io/${{ github.repository }}
        
        # Change all uppercase to lowercase
        IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
        
        # Strip git ref prefix from version
        VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
        
        # Strip "v" prefix from tag name
        [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
        
        # Use Docker `latest` tag convention
        [ "$VERSION" == "main" ] && VERSION=latest
        
        echo IMAGE_ID=$IMAGE_ID
        echo VERSION=$VERSION
        
        # Get the actual image names from Docker
        IMAGES=($(docker images --format "{{.Repository}}:{{.Tag}}" | grep wordpress))
        
        for IMAGE in "${IMAGES[@]}"; do
          # Derive the tag from the image name: "wordpress-php83:latest"
          # becomes "php83".
          TAG=$(echo $IMAGE | sed -e 's/^wordpress-//' -e 's/:.*$//')
          FULL_IMAGE_ID=$IMAGE_ID:$TAG
          
          docker tag $IMAGE $FULL_IMAGE_ID
          docker push $FULL_IMAGE_ID
        done

        # Tag the default aliases
        docker tag $IMAGE_ID:php83 $IMAGE_ID:latest
        docker push $IMAGE_ID:latest