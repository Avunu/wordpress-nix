name: Build and Push WordPress Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Build Docker Images
      run: |
        nix build .#wordpress-php82 .#wordpress-php83 .#wordpress-php84 .#wordpress-d1-php83 .#wordpress-d1-php84
        for image in result result-*; do
          docker load < "$image"
        done

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push images to GitHub Container Registry
      run: |
        IMAGE_ID=ghcr.io/${{ github.repository }}
        
        # Change all uppercase to lowercase
        IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
        
        # Strip git ref prefix from version
        VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
        
        # Strip "v" prefix from tag name
        [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
        
        # Use Docker `latest` tag convention
        [ "$VERSION" == "main" ] && VERSION=latest
        
        echo IMAGE_ID=$IMAGE_ID
        echo VERSION=$VERSION
        
        # Get the actual image names from Docker
        IMAGES=($(docker images --format "{{.Repository}}:{{.Tag}}" | grep wordpress))
        
        for IMAGE in "${IMAGES[@]}"; do
          # Derive the tag from the image name: "wordpress-php83:latest"
          # becomes "php83", "wordpress-d1-php84:latest" becomes "d1-php84".
          TAG=$(echo $IMAGE | sed -e 's/^wordpress-//' -e 's/:.*$//')
          FULL_IMAGE_ID=$IMAGE_ID:$TAG
          
          docker tag $IMAGE $FULL_IMAGE_ID
          docker push $FULL_IMAGE_ID
        done

        # Tag the default aliases
        docker tag $IMAGE_ID:php83 $IMAGE_ID:latest
        docker push $IMAGE_ID:latest
        docker tag $IMAGE_ID:d1-php84 $IMAGE_ID:d1
        docker push $IMAGE_ID:d1