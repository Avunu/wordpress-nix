# Test the platform edge Worker and its nix bundle. Tests run once here,
# centrally — site repos carry no worker code or tests.
name: worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "lib/worker.nix"
      - "flake.lock"
      - ".github/workflows/worker.yml"
  # Deliberately unfiltered: `test` is a required status check on `main`, and a
  # required check that never triggers sits pending forever rather than being
  # skipped — which would wedge every PR that doesn't touch worker/**.
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Materialize the pinned sqlite-database-integration source
        run: nix build .#sqlite-driver-src -o .sqlite-src

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run the worker test suite
        working-directory: worker
        env:
          WP_SQLITE_D1_PROXY_SRC: ${{ github.workspace }}/.sqlite-src/packages/d1-proxy-worker/src/handler.js
        run: |
          npm ci
          npm test

      - name: Build the worker bundle
        run: nix build .#worker
