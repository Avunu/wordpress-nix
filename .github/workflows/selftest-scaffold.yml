name: selftest-scaffold

# The paths of a new site that need the network, which the flake checks cannot take
# (they are offline): `nix flake new -t` from this checkout, `wordpress-nix sync`, a
# Composer change resolved against WP Packages, `nix run .#relock` (the vendor FOD fetched
# from the registries), the build and the pure checks, then the relock pipeline's own
# steps on the result: `ci verify-relock` (a new package is reviewed, a tampered host is
# refused) and `wordpress-nix audit` against a feed that names the new plugin.
#
# Self-hosted (the nixos runners), no secret; a pull request from a fork runs on
# ubuntu-latest.

on:
  pull_request:
    paths:
      - templates/bedrock-site/**
      - lib/**
      - modules/site.nix
      - modules/flake-module.nix
      - py/wordpress_nix_tools/**
      - flake.nix
      - flake.lock
      - .github/workflows/selftest-scaffold.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: selftest-scaffold-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "nixos"]') }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wordpress-nix
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      - name: A new site from the template, on this checkout
        working-directory: ${{ runner.temp }}
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          nix flake new -t "path:$GITHUB_WORKSPACE/wordpress-nix" site-selftest
          cd site-selftest
          sed -i 's/name = "changeme";/name = "selftest";/' flake.nix
          git init -q -b main
          git remote add origin https://github.com/Avunu/site-selftest.git
          git add -A # a flake in a git work tree sees tracked files only
          nix flake lock --override-input wordpress-nix "path:$GITHUB_WORKSPACE/wordpress-nix"
          git add -A
          git -c user.name=selftest -c user.email=selftest@example.org commit -qm "chore: the template"

      - name: wordpress-nix sync renders the managed files, then is clean
        working-directory: ${{ runner.temp }}/site-selftest
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          nix run .#wordpress-nix -- sync --write --offline
          git add -A
          git -c user.name=selftest -c user.email=selftest@example.org commit -qm "chore: sync"
          test -f .github/workflows/ci.yml
          test "$(jq -r .slug .github/wordpress-nix.json)" = selftest
          nix run .#wordpress-nix -- sync --check --offline

      - name: A Composer change, relocked and built
        working-directory: ${{ runner.temp }}/site-selftest
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          echo "before=$before" >> "$GITHUB_ENV"
          nix run .#composer -- require --no-install --no-interaction "wp-plugin/hello-dolly:^1.7"
          nix run .#relock
          nix build -L --no-link .#default .#checks.x86_64-linux.composer-validate .#checks.x86_64-linux.vendor-hash
          git add -A
          git -c user.name=selftest -c user.email=selftest@example.org commit -qm "feat: hello-dolly"

      - name: verify-relock reviews the new package and refuses a tampered host
        working-directory: ${{ runner.temp }}/site-selftest
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          out="$(nix run .#wordpress-nix -- ci verify-relock --base "$before" --head "$(git rev-parse HEAD)")"
          echo "$out"
          [ "$(head -n1 <<<"$out")" = needs-review ]
          jq '(.packages[] | select(.name == "wp-plugin/hello-dolly") | .dist.url) |= sub("downloads.wordpress.org"; "evil.example")' \
            composer.lock > lock.tmp && mv lock.tmp composer.lock
          git add -A
          git -c user.name=selftest -c user.email=selftest@example.org commit -qm "test: tamper"
          if nix run .#wordpress-nix -- ci verify-relock --base "$before" --head "$(git rev-parse HEAD)"; then
            echo "::error::verify-relock accepted a dist URL on another host"
            exit 1
          fi
          git reset -q --hard HEAD^

      - name: wordpress-nix audit flags a vulnerable version the change introduced
        working-directory: ${{ runner.temp }}/site-selftest
        run: |
          set -euo pipefail
          jq -n '{"selftest-1": {title: "Hello Dolly selftest", software: [{type: "plugin", slug: "hello-dolly",
            affected_versions: {"*": {from_version: "*", from_inclusive: true, to_version: "*", to_inclusive: true}}}]}}' \
            > "$RUNNER_TEMP/feed.json"
          if nix run .#wordpress-nix -- audit --feed "$RUNNER_TEMP/feed.json" --base "$before"; then
            echo "::error::audit passed a vulnerable plugin the change added"
            exit 1
          fi
          nix run .#wordpress-nix -- audit --feed "$RUNNER_TEMP/feed.json" --base HEAD
