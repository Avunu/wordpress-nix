name: Dependabot auto-merge

# Enables auto-merge on every Dependabot PR, major-version bumps included. The
# gate is the test suite, not the update type: GitHub merges once the branch is
# mergeable and all *required* status checks pass, so a bump that breaks
# something holds its PR open instead of landing on main.
#
# That makes the required checks load-bearing. Without them GitHub considers the
# PR mergeable the instant it opens and this merges on nothing.
#
# Requires (one-time, in repo settings):
#   • Settings → General → Pull Requests → "Allow auto-merge"
#   • Settings → Rules → ruleset on `main` requiring the "test" (worker) and
#     "build" (oci) checks
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Updates of the documentation site's packages (docs-site/) and of the commit pin of its shared
    # workflows (github-actions pull requests) are reviewed by a person: a merge to the default branch
    # publishes the site.
    if: ${{ github.actor == 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/docs-site') && !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
