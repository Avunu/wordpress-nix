name: check

# CI gate for this repo. Auto-merge (Dependabot PRs) is only as safe as what runs here,
# so these are what you mark required on `main`. Same shape as frappe-nix's check.yml.
#
# The `flake` job evaluates every flake output on x86_64-linux, which is what breaks when
# nixpkgs moves under us, then builds every check that is not a NixOS VM test. The list
# is read from the flake, not written here, so a new check is on the PR path the moment
# it is in `checks`.
#
# The `vm-tests` job builds the NixOS VM tests (a runNixOSTest result carries a
# `driver`), one matrix entry each, on GitHub-hosted runners, which have KVM. A
# `workflow_dispatch` runs them only with `vm-tests: true`.
#
# A failed `flake` or VM test uploads the failed derivations and the end of their logs,
# and `report` comments them, with every job's result, on the pull request (Avunu/gitops's
# nix-failures and check-report actions). A passing run only edits an earlier comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      vm-tests:
        description: Also build the NixOS VM tests
        type: boolean
        default: false

permissions: {}

# A newer push to a PR replaces its run; main's pushes, the scheduled and
# dispatched runs always finish, each in a group of its own. The self-hosted
# runners share one host: a superseded run left going only slows the others.
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    permissions:
      contents: read # the checkout
    outputs:
      vm-tests: ${{ steps.split.outputs.vm-tests }}
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: runner.environment == 'github-hosted'
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      # Evaluating the dev shell makes devenv fetch its own pinned sources (import from
      # derivation), which `nix flake check --no-build` cannot build. `nix eval` can, so
      # realise them first.
      - name: Fetch what the dev shell imports from derivation
        run: nix eval --raw .#devShells.x86_64-linux.default.drvPath

      # Evaluates checks/packages/apps/devShells and the NixOS module without building
      # the VM tests. Catches the overwhelming majority of flake.lock breakage.
      - name: Evaluate all flake outputs
        shell: bash # -o pipefail, through the tee
        run: nix flake check --no-build --show-trace 2>&1 | tee "$RUNNER_TEMP/nix.log"

      # checks.x86_64-linux, split in two: the NixOS VM tests (a runNixOSTest result
      # has a `driver`) go to the `vm-tests` job, everything else is built below.
      - name: List the checks
        id: split
        run: |
          # The ${n} is Nix's, not the shell's.
          # shellcheck disable=SC2016
          nix eval --json .#checks.x86_64-linux \
            --apply 'cs: builtins.partition (n: cs.${n} ? driver) (builtins.attrNames cs)' \
            > "$RUNNER_TEMP/checks.json"
          echo "vm-tests=$(jq -c .right "$RUNNER_TEMP/checks.json")" >> "$GITHUB_OUTPUT"
          jq -r '.wrong[]' "$RUNNER_TEMP/checks.json" > "$RUNNER_TEMP/offline-checks"
          echo "VM tests: $(jq -c .right "$RUNNER_TEMP/checks.json")"
          echo "Offline checks: $(wc -l < "$RUNNER_TEMP/offline-checks")"

      # Every check that is not a VM test: the Bedrock build fixtures, the template, the
      # checksum verifier and the tools, all offline and no KVM. `--keep-going` so one
      # failure does not hide the others.
      - name: Build the offline checks
        shell: bash # -o pipefail, through the tee
        run: |
          sed 's|^|.#checks.x86_64-linux.|' "$RUNNER_TEMP/offline-checks" \
            | xargs nix build -L --show-trace --keep-going --no-link 2>&1 \
            | tee -a "$RUNNER_TEMP/nix.log"

      - if: failure()
        uses: Avunu/gitops/.github/actions/nix-failures@v1.0.0
        with:
          log: ${{ runner.temp }}/nix.log
          title: flake
          output: ${{ runner.temp }}/failures/flake.md

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failures-flake
          path: ${{ runner.temp }}/failures/flake.md
          if-no-files-found: ignore

  vm-tests:
    needs: flake
    if: github.event_name != 'workflow_dispatch' || inputs.vm-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # the checkout
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.flake.outputs.vm-tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `kvm` stays at its default (on): the installer adds the udev rule so the
      # daemon advertises the `kvm` system feature the VM tests need.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: runner.environment == 'github-hosted'
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      - name: Run the ${{ matrix.test }} NixOS test
        shell: bash # -o pipefail, through the tee
        env:
          TEST: ${{ matrix.test }}
        run: nix build ".#checks.x86_64-linux.$TEST" -L --show-trace 2>&1 | tee "$RUNNER_TEMP/nix.log"

      - if: failure()
        uses: Avunu/gitops/.github/actions/nix-failures@v1.0.0
        with:
          log: ${{ runner.temp }}/nix.log
          title: vm-tests (${{ matrix.test }})
          output: ${{ runner.temp }}/failures/vm-${{ matrix.test }}.md

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failures-vm-${{ matrix.test }}
          path: ${{ runner.temp }}/failures/vm-${{ matrix.test }}.md
          if-no-files-found: ignore

  report:
    needs: [flake, vm-tests]
    # `!cancelled()`: a run a newer push superseded has nothing to say. A fork's pull
    # request gets a read-only token, so no comment. A dispatched run finds its pull
    # request by branch.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON('["self-hosted","nixos"]') }}
    timeout-minutes: 5
    permissions:
      pull-requests: write # the comment
    steps:
      - uses: Avunu/gitops/.github/actions/check-report@v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
