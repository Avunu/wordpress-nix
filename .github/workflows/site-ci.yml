name: site-ci

# A site repository's gates (docs/production/site-ci.md; moonshot v3 §6.2), reusable. The
# site's ci.yml calls it from one job named `ci`, so the checks read:
#
#   ci / flake         (required) every pure check of the site flake but smoke: composer
#                      validate, the vendor hash, the build (and any the site adds); no
#                      dump, auth.json or .env tracked. A push to the integration branch
#                      then uploads the vendor tree (the FOD the cluster substitutes by its
#                      output path) to the binary cache with the write token.
#   ci / smoke         (required) checks.smoke: the package booted in a NixOS VM, on a KVM
#                      runner.
#   ci / audit         (required) the networked audits, as job steps outside the sandbox:
#                      `composer audit` (Packagist advisories), verify-wp-checksums (the
#                      build against wordpress.org) and `wordpress-nix audit` (Wordfence),
#                      which fails only on a vulnerability the change introduces.
#   ci / premium-diff  (advisory) on a pull request, what the change adds to committed
#                      plugin, theme and mu-plugin code that a person should read: eval,
#                      base64_decode, gzinflate, create_function, assert() on a variable,
#                      outbound URL literals and long opaque strings. Warnings only.
#
# Every job runs the site's own flake (its locked wordpress-nix) and holds no write token
# but the cache's, which only a push to the integration branch sees. A pull request from
# a fork runs on ubuntu-latest; the rest on the runners the caller names.

on:
  workflow_call:
    inputs:
      integration-branch:
        type: string
        default: main
      runs-on:
        description: >-
          The runner of flake, audit and premium-diff, as JSON: a label or a list of labels
          (`["self-hosted", "nixos"]`). A pull request from a fork always runs on
          ubuntu-latest.
        type: string
        default: '["self-hosted", "nixos"]'
      smoke-runs-on:
        description: "The runner of smoke, as JSON: it needs KVM."
        type: string
        default: '["self-hosted", "linux", "x64", "kvm"]'
      nix-cache:
        description: '"", "cachix:<name>" or "attic:<endpoint>/<cache>" (the WORDPRESS_NIX_CACHE variable)'
        type: string
        default: ""
      wordpress-nix-override:
        description: wordpress-nix's self-test only (a path in the workspace)
        type: string
        default: ""
    secrets:
      NIX_CACHE_TOKEN:
        description: The cache's write token (WORDPRESS_NIX_CACHE_TOKEN), used on a push to the integration branch only
        required: false
      NIX_CACHE_READ_TOKEN:
        description: The cache's read token (WORDPRESS_NIX_CACHE_READ_TOKEN)
        required: false
      WORDFENCE_API_KEY:
        description: The Wordfence Intelligence API key (an Actions and a Dependabot secret)
        required: false

permissions: {}

env:
  FORCE_COLOR: "1"

jobs:
  flake:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      # The binary cache (moonshot v3 §4.16): none, cachix:<name> or attic:<endpoint>/<cache>.
      # Only a push to the integration branch ever sees the write token.
      - id: cache
        name: Binary cache
        env:
          CACHE: ${{ inputs.nix-cache }}
          OVERRIDE: ${{ inputs.wordpress-nix-override }}
          WRITE: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.integration-branch) }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            "") echo "kind=none" >> "$GITHUB_OUTPUT" ;;
            cachix:*) echo "kind=cachix" >> "$GITHUB_OUTPUT"; echo "name=${CACHE#cachix:}" >> "$GITHUB_OUTPUT" ;;
            attic:*/*)
              rest="${CACHE#attic:}"
              echo "kind=attic" >> "$GITHUB_OUTPUT"
              echo "endpoint=${rest%/*}" >> "$GITHUB_OUTPUT"
              echo "name=${rest##*/}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::nix-cache must be empty, cachix:<name> or attic:<endpoint>/<cache>, not $CACHE"; exit 1 ;;
          esac
          echo "write=$WRITE" >> "$GITHUB_OUTPUT"
          if [ -n "$CACHE" ] && [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            # A self-hosted runner's home outlives the job: the cache's credentials stay in the job's temp dir.
            mkdir -p "$RUNNER_TEMP/config"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            # wordpress-nix's self-test: every nix call uses this checkout of wordpress-nix.
            echo "NIX_OVERRIDE=--override-input wordpress-nix path:$GITHUB_WORKSPACE/$OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "NIX_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      - if: steps.cache.outputs.kind == 'cachix'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cache.outputs.name }}
          authToken: ${{ steps.cache.outputs.write == 'true' && secrets.NIX_CACHE_TOKEN || secrets.NIX_CACHE_READ_TOKEN }}
          skipPush: true

      - if: steps.cache.outputs.kind == 'attic'
        name: attic
        env:
          TOKEN: ${{ steps.cache.outputs.write == 'true' && secrets.NIX_CACHE_TOKEN || secrets.NIX_CACHE_READ_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          # Not `nix profile install`: a self-hosted runner's profile outlives the job.
          attic="$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/nixos-unstable#attic-client^out")/bin"
          echo "$attic" >> "$GITHUB_PATH"
          PATH="$attic:$PATH"
          attic login ci "$ENDPOINT" ${TOKEN:+"$TOKEN"}
          attic use "ci:$NAME"

      - name: No database dump, Composer credentials or .env file in git
        run: |
          set -euo pipefail
          mapfile -t found < <(git ls-files | grep -E '(\.sql(\.gz)?$|(^|/)auth\.json$|(^|/)\.env$)' || true)
          if [ "${#found[@]}" -gt 0 ]; then
            printf '::error::%s is tracked: dumps, auth.json and .env never go into a site repository\n' "${found[@]}"
            exit 1
          fi

      # Every check but smoke (its own job, on KVM), named by the flake itself, so a check
      # the site adds is a gate too.
      - name: The site flake's pure checks
        run: |
          set -euo pipefail
          read -ra override <<< "$NIX_OVERRIDE"
          mapfile -t names < <(nix eval --json "${override[@]}" .#checks.x86_64-linux \
            --apply 'cs: builtins.filter (n: n != "smoke") (builtins.attrNames cs)' | jq -r '.[]')
          echo "checks: ${names[*]}"
          nix build -L --no-link "${override[@]}" "${names[@]/#/.#checks.x86_64-linux.}"

      # The vendor tree, by its output path, which depends on its name and hash only: the
      # cluster's nodes substitute it although they build the package with their own
      # wordpress-nix. A merge made by the App starts this push.
      - if: steps.cache.outputs.write == 'true' && steps.cache.outputs.kind != 'none'
        name: Upload the vendor tree to the cache
        env:
          KIND: ${{ steps.cache.outputs.kind }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          read -ra override <<< "$NIX_OVERRIDE"
          vendor="$(nix build --no-link --print-out-paths "${override[@]}" .#vendor)"
          case "$KIND" in
            cachix) cachix push "$NAME" "$vendor" ;;
            attic) attic push "ci:$NAME" "$vendor" ;;
          esac
          echo "pushed $vendor"

  smoke:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.smoke-runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm

      - id: cache
        name: Binary cache
        env:
          CACHE: ${{ inputs.nix-cache }}
          OVERRIDE: ${{ inputs.wordpress-nix-override }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            "") echo "kind=none" >> "$GITHUB_OUTPUT" ;;
            cachix:*) echo "kind=cachix" >> "$GITHUB_OUTPUT"; echo "name=${CACHE#cachix:}" >> "$GITHUB_OUTPUT" ;;
            attic:*/*)
              rest="${CACHE#attic:}"
              echo "kind=attic" >> "$GITHUB_OUTPUT"
              echo "endpoint=${rest%/*}" >> "$GITHUB_OUTPUT"
              echo "name=${rest##*/}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::nix-cache must be empty, cachix:<name> or attic:<endpoint>/<cache>, not $CACHE"; exit 1 ;;
          esac
          if [ -n "$CACHE" ] && [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            mkdir -p "$RUNNER_TEMP/config"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            echo "NIX_OVERRIDE=--override-input wordpress-nix path:$GITHUB_WORKSPACE/$OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "NIX_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      - if: steps.cache.outputs.kind == 'cachix'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cache.outputs.name }}
          authToken: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          skipPush: true

      - if: steps.cache.outputs.kind == 'attic'
        name: attic
        env:
          TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          attic="$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/nixos-unstable#attic-client^out")/bin"
          PATH="$attic:$PATH"
          attic login ci "$ENDPOINT" ${TOKEN:+"$TOKEN"}
          attic use "ci:$NAME"

      - name: The site booted in a NixOS VM (checks.smoke)
        run: |
          set -euo pipefail
          read -ra override <<< "$NIX_OVERRIDE"
          nix build -L --no-link "${override[@]}" .#checks.x86_64-linux.smoke

  audit:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      # The history: `wordpress-nix audit --base` reads the merge-base's lock and plugins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      - id: cache
        name: Binary cache
        env:
          CACHE: ${{ inputs.nix-cache }}
          OVERRIDE: ${{ inputs.wordpress-nix-override }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            "") echo "kind=none" >> "$GITHUB_OUTPUT" ;;
            cachix:*) echo "kind=cachix" >> "$GITHUB_OUTPUT"; echo "name=${CACHE#cachix:}" >> "$GITHUB_OUTPUT" ;;
            attic:*/*)
              rest="${CACHE#attic:}"
              echo "kind=attic" >> "$GITHUB_OUTPUT"
              echo "endpoint=${rest%/*}" >> "$GITHUB_OUTPUT"
              echo "name=${rest##*/}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::nix-cache must be empty, cachix:<name> or attic:<endpoint>/<cache>, not $CACHE"; exit 1 ;;
          esac
          if [ -n "$CACHE" ] && [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            mkdir -p "$RUNNER_TEMP/config"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            echo "NIX_OVERRIDE=--override-input wordpress-nix path:$GITHUB_WORKSPACE/$OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "NIX_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      - if: steps.cache.outputs.kind == 'cachix'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cache.outputs.name }}
          authToken: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          skipPush: true

      - if: steps.cache.outputs.kind == 'attic'
        name: attic
        env:
          TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          attic="$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/nixos-unstable#attic-client^out")/bin"
          PATH="$attic:$PATH"
          attic login ci "$ENDPOINT" ${TOKEN:+"$TOKEN"}
          attic use "ci:$NAME"

      # What the change is compared with: a pull request's merge-base, a push's previous
      # head (its parent when the branch is new).
      - id: base
        name: The commit this change is audited against
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$(git merge-base "$PR_BASE" HEAD)"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            base="$BEFORE"
          elif git rev-parse -q --verify HEAD^ > /dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "audited against ${base:-nothing (every finding fails)}"

      # Packagist's advisories, for the PHP libraries (wp-plugin/* have none there).
      - name: composer audit
        run: |
          set -euo pipefail
          read -ra override <<< "$NIX_OVERRIDE"
          nix run "${override[@]}" .#composer -- audit --locked --no-dev --abandoned=report

      # Core and every wp-plugin/* against wordpress.org's published checksums, every
      # wp-theme/* against its locked zip: a differing or extra PHP file fails.
      - name: verify-wp-checksums
        run: |
          set -euo pipefail
          read -ra override <<< "$NIX_OVERRIDE"
          nix run "${override[@]}" .#verify-wp-checksums

      - name: Wordfence (only what this change introduces fails)
        env:
          WORDFENCE_API_KEY: ${{ secrets.WORDFENCE_API_KEY }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          if [ -z "$WORDFENCE_API_KEY" ]; then
            echo "::error::WORDFENCE_API_KEY is not set: store it as an Actions and a Dependabot secret and pass it to site-ci.yml"
            exit 1
          fi
          read -ra override <<< "$NIX_OVERRIDE"
          args=(audit --markdown "$RUNNER_TEMP/audit.md")
          if [ -n "$BASE" ]; then
            args+=(--base "$BASE")
          fi
          status=0
          nix run "${override[@]}" .#wordpress-nix -- "${args[@]}" || status=$?
          { echo "## Wordfence"; echo; cat "$RUNNER_TEMP/audit.md" 2> /dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  premium-diff:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The lines the change adds to committed code (web/app/{plugins,themes,mu-plugins}),
      # each pattern a warning on its line. Advisory: it never fails, and main does not
      # require it.
      - name: What the change adds to committed premium and custom code
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "$PR_BASE" HEAD)"
          patterns=(
            'eval[[:space:]]*\('
            'base64_decode[[:space:]]*\('
            'gzinflate[[:space:]]*\('
            'str_rot13[[:space:]]*\('
            'create_function[[:space:]]*\('
            'assert[[:space:]]*\([[:space:]]*\$'
            '(https?:)?//[A-Za-z0-9.-]+\.[a-z]{2,}/[^"'"'"' ]*\.php'
            '[A-Za-z0-9+/=]{200,}'
          )
          n=0
          while IFS=$'\t' read -r file line text; do
            for p in "${patterns[@]}"; do
              if grep -qE -- "$p" <<<"$text"; then
                echo "::warning file=$file,line=$line,title=premium-diff::added code matches ${p}"
                n=$((n + 1))
              fi
            done
          done < <(git diff --unified=0 --no-color "$base" HEAD -- 'web/app/plugins' 'web/app/themes' 'web/app/mu-plugins' \
            | awk '/^\+\+\+ b\//{file=substr($0,7)} /^@@/{split($3,a,/[,+]/); line=a[2]-1} /^\+[^+]/{line++; print file "\t" line "\t" substr($0,2)} /^ /{line++}')
          echo "premium-diff: $n line(s) to read" | tee -a "$GITHUB_STEP_SUMMARY"
