name: site-deps

# Dependency pull requests of a site repository (docs/production/site-ci.md; moonshot v3
# §4.4, §6.3, §6.4), reusable: the Composer lane of frappe-nix's app-deps.yml, on
# python-devops-nix's standards-core steps.
#
#   disarm          every new head of a Dependabot Composer PR starts with auto-merge off,
#                   until the relock and the verdict say otherwise (GITHUB_TOKEN only)
#   relock-plan     `nix run .#relock` on the PR's head: nix/vendor-hash follows the
#                   new composer.lock. Runs the PR's code with no write token, on the
#                   caller's runner, and uploads the patch
#   relock-push     checks the patch (`ci apply-relock-patch`: nix/vendor-hash, mode
#                   100644, nothing else), then what composer.lock says (`ci
#                   verify-relock`: the URL names the same package and version, against
#                   the PR's merge-base), mints the App's token, pushes `chore(deps):
#                   relock vendor hash [dependabot skip]`, and enables auto-merge when the
#                   lock is ok and the decision table says relock (or auto, policy `all`);
#                   else labels the PR needs-review with auto-merge off
#   auto-merge      every Dependabot PR's verdict (`wordpress-nix site-verdict`, the §6.4
#                   table): github-actions bumps auto-merge or close; a Composer PR waits
#                   for relock-push, or, when there was nothing to relock, auto-merges once
#                   its own lock passes verify-relock
#   hold            a head no job reached a verdict on: auto-merge off, needs-review
#                   (GITHUB_TOKEN only)
#   sweep           (schedule, dispatch) CI for bot PRs whose head has no ci / * run
#   update-branches (push to the integration branch, schedule, dispatch) bot PRs that are
#                   behind are brought up to date
#
# With the GitHub App (APP_ID and APP_PRIVATE_KEY, as org Actions and Dependabot secrets)
# the pushes and merges use its token, so they start CI by themselves; the App-made merge's
# push to main runs site-ci, which uploads the vendor tree with the cache's write token.
# Without one, GITHUB_TOKEN, and CI is dispatched.
#
# Every job that can hold the App's key (relock-push, auto-merge, update-branches) runs on
# ubuntu-latest whatever `runs-on` says, runs none of the PR's code, and installs
# wordpress-nix-tools only from wordpress-nix-repo, at the revision the integration
# branch's flake.lock pins, hash-locked (python-devops-nix's standards-install,
# `hardened`). Every `gh pr merge --auto` names the head it was decided on
# (--match-head-commit). Since GitHub keeps auto-merge on across a push, a Composer PR's
# new head starts with it off (disarm), and a head no job decided is held (hold).
#
# wordpress-nix moves only through rollout.yml, which relocks in its own PR: there is no
# relock-inputs step, and a Dependabot PR never changes flake.lock.

on:
  workflow_call:
    inputs:
      integration-branch:
        type: string
        default: main
      nix-cache:
        description: '"", "cachix:<name>" or "attic:<endpoint>/<cache>" (the WORDPRESS_NIX_CACHE variable)'
        type: string
        default: ""
      auto-merge:
        description: dependabot.auto-merge
        type: boolean
        default: true
      auto-merge-policy:
        description: 'dependabot.auto-merge-policy: "decision-table", or "all"'
        type: string
        default: decision-table
      update-branches:
        description: dependabot.update-branches
        type: boolean
        default: true
      merge-method:
        description: the first of repo-policy.merge-methods
        type: string
        default: squash
      wordpress-nix-repo:
        description: >-
          The repository wordpress-nix-tools is installed from in the jobs that can hold the
          App's key, as owner/name: the site's flake.lock must lock wordpress-nix from it.
        type: string
        default: Avunu/wordpress
      wordpress-nix-override:
        description: wordpress-nix's self-test only (a path in the workspace)
        type: string
        default: ""
      runs-on:
        description: >-
          The runner of relock-plan (the only job that runs the PR's code), as JSON: a label
          or a list of labels (`["self-hosted", "nixos"]`). A PR from a fork, and every job
          that can hold a write token, runs on ubuntu-latest.
        type: string
        default: '["self-hosted", "nixos"]'
    secrets:
      NIX_CACHE_READ_TOKEN:
        required: false
      APP_ID:
        description: >-
          The GitHub App's ID (or client ID). A Dependabot run sees only Dependabot secrets:
          it is stored as both.
        required: false
      APP_PRIVATE_KEY:
        description: "The GitHub App's private key (PEM), as an Actions and a Dependabot secret"
        required: false

permissions: {}

env:
  FORCE_COLOR: "1"

jobs:
  # A Composer PR's verdict comes only after relock-plan, and GitHub keeps an auto-merge an
  # earlier head's run enabled across Dependabot's push of a new head (a group refreshed in
  # place): it checks --match-head-commit when auto-merge is enabled, not when it merges.
  # So every new head starts with auto-merge off, until relock-push or auto-merge enables it
  # again for that head. GITHUB_TOKEN only, nothing checked out or run.
  disarm:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/composer/') && inputs.auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # gh pr merge --disable-auto
      pull-requests: write # gh pr merge --disable-auto
    steps:
      - name: Turn off auto-merge an earlier head's run enabled
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" != true ]; then
            echo "auto-merge is not enabled on $PR_URL"
            exit 0
          fi
          gh pr merge --disable-auto "$PR_URL"
          echo "::notice::auto-merge turned off on $PR_URL until this head is relocked and checked"

  relock-plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/composer/')
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read # the checkout; this job runs the PR's code and holds no write token
    outputs:
      empty: ${{ steps.patch.outputs.empty }}
    steps:
      # A self-hosted runner reuses $RUNNER_TEMP and the workspace, and an interrupted job leaves
      # read-only files there (copies out of the Nix store) that the runner's cleanup and checkout
      # cannot remove: clear $RUNNER_TEMP, keeping the runner's _* files, and make the workspace
      # writable for checkout to clean. The working directory is $RUNNER_TEMP, which always exists.
      - if: runner.environment != 'github-hosted'
        name: Clear what an earlier job left in the runner's temp dir and workspace
        working-directory: ${{ runner.temp }}
        run: |
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' ! -type l -exec chmod -R u+w {} +
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} +
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -type l -exec chmod -R u+w {} +
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: runner.environment == 'github-hosted'
        with:
          determinate: false

      # The binary cache (moonshot v3 §4.16), read only: none, cachix:<name> or
      # attic:<endpoint>/<cache>.
      - id: cache
        name: Binary cache
        env:
          CACHE: ${{ inputs.nix-cache }}
          OVERRIDE: ${{ inputs.wordpress-nix-override }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            "") echo "kind=none" >> "$GITHUB_OUTPUT" ;;
            cachix:*) echo "kind=cachix" >> "$GITHUB_OUTPUT"; echo "name=${CACHE#cachix:}" >> "$GITHUB_OUTPUT" ;;
            attic:*/*)
              rest="${CACHE#attic:}"
              echo "kind=attic" >> "$GITHUB_OUTPUT"
              echo "endpoint=${rest%/*}" >> "$GITHUB_OUTPUT"
              echo "name=${rest##*/}" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::nix-cache must be empty, cachix:<name> or attic:<endpoint>/<cache>, not $CACHE"; exit 1 ;;
          esac
          if [ -n "$CACHE" ] && [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            # A self-hosted runner's home outlives the job: the cache's credentials stay in the job's temp dir.
            mkdir -p "$RUNNER_TEMP/config"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          fi
          if [ -n "$OVERRIDE" ]; then
            # wordpress-nix's self-test: every nix call uses this checkout of wordpress-nix.
            echo "NIX_OVERRIDE=--override-input wordpress-nix path:$GITHUB_WORKSPACE/$OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "NIX_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      - if: steps.cache.outputs.kind == 'cachix'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cache.outputs.name }}
          authToken: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          skipPush: true

      - if: steps.cache.outputs.kind == 'attic'
        name: attic
        env:
          TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
          ENDPOINT: ${{ steps.cache.outputs.endpoint }}
          NAME: ${{ steps.cache.outputs.name }}
        run: |
          set -euo pipefail
          # Not `nix profile install`: a self-hosted runner's profile outlives the job.
          attic="$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/nixos-unstable#attic-client^out")/bin"
          PATH="$attic:$PATH"
          attic login ci "$ENDPOINT" ${TOKEN:+"$TOKEN"}
          attic use "ci:$NAME"

      # The vendor FOD rebuilt from the PR's composer.lock (with lib.fakeHash, then its own
      # hash), written to nix/vendor-hash and confirmed by a second build (lib/relock.nix).
      - name: Relock
        env:
          WORDPRESS_NIX_CI: "1"
        run: |
          set -euo pipefail
          # The vendor FOD's hash depends on composer.json and composer.lock only (and
          # Composer's version): the self-test's override changes which relock runs, not
          # what it builds.
          read -ra override <<< "$NIX_OVERRIDE"
          nix run "${override[@]}" .#relock

      # Staged and written as data for relock-push; never a workflow file.
      - id: patch
        name: The relock patch
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/relock.patch"
          if git diff --cached --name-only | grep -qE '(^|/)\.github/'; then
            echo "::error::the relock changed a file under .github/, which relock-push never pushes"
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/relock.patch" ]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi
          git --no-pager diff --cached --stat

      - if: steps.patch.outputs.empty == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relock-patch
          path: ${{ runner.temp }}/relock.patch

  # Holds the write token: GitHub-hosted whatever `runs-on` says, and nothing of the PR's runs.
  relock-push:
    needs: relock-plan
    if: needs.relock-plan.outputs.empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the relock commit to the Dependabot branch without the App
      actions: write # without the App, dispatch ci.yml on it
      pull-requests: write # enable auto-merge, or label needs-review
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      # The commit relock-plan made its patch on, with its history (the merge-base's lock is
      # what verify-relock compares with). The push below is not forced: if the branch has
      # moved since, it is refused, and the new head's own run relocks it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: merge-base
        name: The PR's merge-base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "sha=$(git merge-base "$BASE_SHA" HEAD)" >> "$GITHUB_OUTPUT"

      # The integration branch: its flake.lock names the wordpress-nix-tools to install, its
      # wordpress-nix.toml the gates auto-merge waits for, and its .github/wordpress-nix.json
      # the site's facts the verdict reads.
      - name: Base checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration-branch }}
          path: .base
          persist-credentials: false

      # This job can hold the App's key, so nothing it installs is resolved at run time:
      # wordpress-nix-tools from wordpress-nix-repo alone, at the full revision the
      # integration branch's flake.lock pins (never the PR's), every dependency from that
      # revision's py/wordpress_nix_tools/uv.lock by hash, standards-core from
      # Avunu/python-devops-nix at the revision that lock names. Before the App's token.
      - uses: Avunu/python-devops-nix/.github/actions/standards-install@d3a87609e2fd4510dfe2e11a75f219f589e2659b # python-devops-nix d3a87609e2fd4510dfe2e11a75f219f589e2659b
        with:
          cli: wordpress-nix
          engine-input: wordpress-nix
          env-prefix: WORDPRESS_NIX
          install-spec: >-
            wordpress-nix-tools @ git+https://github.com/{owner}/{repo}@{rev}#subdirectory=py/wordpress_nix_tools
          hardened: "true"
          source: ${{ inputs.wordpress-nix-repo }}
          project: py/wordpress_nix_tools
          git-sources: Avunu/python-devops-nix
          override: ${{ inputs.wordpress-nix-override && format('{0}/py/wordpress_nix_tools', inputs.wordpress-nix-override) || '' }}
          working-directory: .base

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relock-patch
          path: ${{ runner.temp }}/relock

      # relock-plan ran the PR's code, so its patch is data to check, before any token
      # exists: only nix/vendor-hash (ci.relock_patch_paths), an added or modified regular
      # file (mode 100644). A rename, copy, mode change, symlink, any other path, anything
      # under .github/ or an empty patch is refused, and nothing is pushed.
      - name: Check and apply the relock patch (nothing else runs)
        env:
          PATCH: ${{ runner.temp }}/relock/relock.patch
        run: wordpress-nix ci apply-relock-patch --patch "$PATCH"

      # What composer.lock says, before the App's token is minted, against the merge-base
      # (git only; nothing of the patch runs): a dist URL that does not name its package and
      # version is a reject (exit 1, nothing pushed); a new or removed package is
      # needs-review; nix/vendor-hash is one SRI hash, never lib.fakeHash.
      - id: locks
        name: Check what the lock says, against the PR's merge-base
        env:
          MERGE_BASE: ${{ steps.merge-base.outputs.sha }}
        run: wordpress-nix ci verify-relock --base "$MERGE_BASE" --head "$(git write-tree)"

      # The decision table, from the PR's metadata (the job's own token) and the
      # integration branch's site facts: `relock`, or `auto` (policy `all` lifting a
      # review), auto-merges after this push, and only when verify-relock said ok.
      - id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - id: verdict
        name: The decision table
        working-directory: .base
        env:
          POLICY: ${{ inputs.auto-merge-policy }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GROUP: ${{ steps.meta.outputs.dependency-group }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
        run: |
          set -euo pipefail
          wordpress-nix site-verdict --ecosystem "$ECOSYSTEM" --update-type "$UPDATE_TYPE" \
            --dependency-group "$GROUP" --dependency-names "$NAMES" --directory "${DIRECTORY:-/}" \
            --policy "$POLICY" \
            --engine-repo "$(jq -r '.nodes[.nodes.root.inputs["wordpress-nix"]].locked | "\(.owner)/\(.repo)"' flake.lock)"

      - id: app
        name: Whether the caller passes the GitHub App
        env:
          ENABLED: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - if: steps.app.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Before the push: an auto-merge an earlier run enabled survives it, and must not
      # merge this head.
      - if: steps.locks.outputs.decision != 'ok' || (steps.verdict.outputs.verdict != 'relock' && steps.verdict.outputs.verdict != 'auto')
        name: Hold the PR for review (auto-merge off, labelled needs-review)
        working-directory: .base
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          INTEGRATION: ${{ inputs.integration-branch }}
        run: wordpress-nix ci automerge --verdict review --pr-url "$PR_URL" --integration "$INTEGRATION"

      - id: push
        name: Commit and push to the PR branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(deps): relock vendor hash [dependabot skip]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - if: steps.app.outputs.enabled != 'true'
        name: CI on the new head (a GITHUB_TOKEN push raises no event)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"

      # Only the commit this job pushed (--head-sha), and only where the gates protect the
      # integration branch: else the PR is labelled needs-review.
      - if: inputs.auto-merge && steps.locks.outputs.decision == 'ok' && (steps.verdict.outputs.verdict == 'relock' || steps.verdict.outputs.verdict == 'auto')
        name: Auto-merge, where required checks protect the integration branch
        working-directory: .base
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          INTEGRATION: ${{ inputs.integration-branch }}
          METHOD: ${{ inputs.merge-method }}
          SHA: ${{ steps.push.outputs.sha }}
        run: wordpress-nix ci enable-automerge --pr-url "$PR_URL" --integration "$INTEGRATION" --merge-method "$METHOD" --head-sha "$SHA"

  auto-merge:
    needs: relock-plan
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && inputs.auto-merge && (needs.relock-plan.result == 'success' || needs.relock-plan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh pr merge --auto without the App
      pull-requests: write # enable auto-merge, label or close the PR
    outputs:
      result: ${{ steps.decide.outputs.result }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      # The integration branch, never the PR: its configuration says which gates are
      # required, and its .github/wordpress-nix.json whether the site runs WooCommerce.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration-branch }}
          persist-credentials: false

      # A Composer PR relock-plan found nothing to relock in (its head already carries the
      # relock an earlier run pushed): its lock is checked against the merge-base, as
      # relock-push checks its patch. The PR's commits are only read (git), never run.
      - if: steps.meta.outputs.package-ecosystem == 'composer' && needs.relock-plan.outputs.empty == 'true'
        name: The PR head, as data for the lock check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .head
          fetch-depth: 0
          persist-credentials: false

      - uses: Avunu/python-devops-nix/.github/actions/standards-install@d3a87609e2fd4510dfe2e11a75f219f589e2659b # python-devops-nix d3a87609e2fd4510dfe2e11a75f219f589e2659b
        with:
          cli: wordpress-nix
          engine-input: wordpress-nix
          env-prefix: WORDPRESS_NIX
          install-spec: >-
            wordpress-nix-tools @ git+https://github.com/{owner}/{repo}@{rev}#subdirectory=py/wordpress_nix_tools
          hardened: "true"
          source: ${{ inputs.wordpress-nix-repo }}
          project: py/wordpress_nix_tools
          git-sources: Avunu/python-devops-nix
          override: ${{ inputs.wordpress-nix-override && format('{0}/py/wordpress_nix_tools', inputs.wordpress-nix-override) || '' }}

      - if: steps.meta.outputs.package-ecosystem == 'composer' && needs.relock-plan.outputs.empty == 'true'
        id: locks
        name: Check what the PR's lock says, against its merge-base
        working-directory: .head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: wordpress-nix ci verify-relock --base "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" --head "$HEAD_SHA"

      - id: verdict
        name: The decision table
        env:
          POLICY: ${{ inputs.auto-merge-policy }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GROUP: ${{ steps.meta.outputs.dependency-group }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
        run: |
          set -euo pipefail
          wordpress-nix site-verdict --ecosystem "$ECOSYSTEM" --update-type "$UPDATE_TYPE" \
            --dependency-group "$GROUP" --dependency-names "$NAMES" --directory "${DIRECTORY:-/}" \
            --policy "$POLICY" \
            --engine-repo "$(jq -r '.nodes[.nodes.root.inputs["wordpress-nix"]].locked | "\(.owner)/\(.repo)"' flake.lock)"

      - id: app
        name: Whether the caller passes the GitHub App
        env:
          ENABLED: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - if: steps.app.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The verdict is made on the event's head, and GitHub arms auto-merge only while the
      # PR's head is still that commit (--head-sha, gh pr merge --match-head-commit).
      #   relock or auto     relock-push pushed a patch: it decides (`wait`); nothing to
      #   (Composer)         relock: auto only when the PR's own lock passed verify-relock.
      #                      A Composer `auto` is policy `all` lifting a review: it is armed
      #                      only where verify-relock passed, never on Dependabot's head
      #                      before relock-push (whose hold may already have run)
      #   relock elsewhere   (none in the table) a person's
      #   auto / close / review as the table says
      - id: decide
        name: Apply the verdict
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          INTEGRATION: ${{ inputs.integration-branch }}
          METHOD: ${{ inputs.merge-method }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          RELOCK_EMPTY: ${{ needs.relock-plan.outputs.empty }}
          LOCKS: ${{ steps.locks.outputs.decision }}
        run: |
          set -euo pipefail
          args=(--pr-url "$PR_URL" --integration "$INTEGRATION" --merge-method "$METHOD" --head-sha "$HEAD_SHA")
          verdict="$VERDICT"
          if [ "$ECOSYSTEM" = composer ] && [ "$verdict" = auto ]; then
            # Policy `all` lifts a Composer review to auto: it still goes through the relock
            # and verify-relock, never straight onto Dependabot's head.
            verdict=relock
          fi
          if [ "$verdict" = relock ]; then
            if [ "$ECOSYSTEM" != composer ]; then
              verdict=review
            elif [ "$RELOCK_EMPTY" = true ]; then
              if [ "$LOCKS" = ok ]; then
                args+=(--relock empty)
              else
                verdict=review
              fi
            else
              args+=(--relock patch)
            fi
          fi
          wordpress-nix ci automerge --verdict "$verdict" "${args[@]}"

  # A head no job reached a verdict on is held: relock-plan, relock-push or auto-merge failed
  # or was cancelled (a patch relock-push refuses, a lock verify-relock rejects), or
  # auto-merge left a Composer PR to relock-push (`wait`) and relock-push did not push.
  # Auto-merge off, which disarm may not have done (a run that did not start it), and the
  # needs-review label. GITHUB_TOKEN only, nothing checked out or run.
  hold:
    needs: [disarm, relock-plan, relock-push, auto-merge]
    if: >-
      always() && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
      && inputs.auto-merge
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      || (needs.auto-merge.outputs.result == 'wait' && needs.relock-push.result != 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # gh pr merge --disable-auto
      pull-requests: write # the label, and auto-merge off
    steps:
      - name: Hold for review (auto-merge off, labelled needs-review)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if ! gh pr merge --disable-auto "$PR_URL"; then
            on="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$on" != false ]; then
              echo "::error::could not turn off auto-merge on $PR_URL"
              exit 1
            fi
          fi
          gh label create needs-review --repo "$GITHUB_REPOSITORY" --color d93f0b \
            --description "A dependency update the decision table leaves to a person" --force
          gh pr edit "$PR_URL" --add-label needs-review
          echo "::notice::no job reached a verdict on this head (a job above failed, or the relock was not pushed): auto-merge is off and a person reviews it"

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the checkout, and which workflows exist on each PR head
      actions: write # gh workflow run
      checks: read # which ci / * checks ran on each head
      pull-requests: read # the open bot PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration-branch }}
          persist-credentials: false

      # From the integration branch's flake.lock, never a PR's: this job holds a write token.
      - uses: Avunu/python-devops-nix/.github/actions/standards-install@d3a87609e2fd4510dfe2e11a75f219f589e2659b # python-devops-nix d3a87609e2fd4510dfe2e11a75f219f589e2659b
        with:
          cli: wordpress-nix
          engine-input: wordpress-nix
          env-prefix: WORDPRESS_NIX
          install-spec: >-
            wordpress-nix-tools @ git+https://github.com/{owner}/{repo}@{rev}#subdirectory=py/wordpress_nix_tools
          override: ${{ inputs.wordpress-nix-override && format('{0}/py/wordpress_nix_tools', inputs.wordpress-nix-override) || '' }}

      - name: Re-dispatch CI for bot PRs without ci / * runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: wordpress-nix ci sweep --repo "$GITHUB_REPOSITORY"

  update-branches:
    if: inputs.update-branches && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run at a time; a burst of merges leaves one run pending, which sees them all.
    concurrency:
      group: update-branches-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write # update-branch without an App
      pull-requests: write # update-branch
      actions: write # without an App, dispatch ci.yml on the new head
      checks: read # which ci / * checks ran on that head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration-branch }}
          persist-credentials: false

      - uses: Avunu/python-devops-nix/.github/actions/standards-install@d3a87609e2fd4510dfe2e11a75f219f589e2659b # python-devops-nix d3a87609e2fd4510dfe2e11a75f219f589e2659b
        with:
          cli: wordpress-nix
          engine-input: wordpress-nix
          env-prefix: WORDPRESS_NIX
          install-spec: >-
            wordpress-nix-tools @ git+https://github.com/{owner}/{repo}@{rev}#subdirectory=py/wordpress_nix_tools
          hardened: "true"
          source: ${{ inputs.wordpress-nix-repo }}
          project: py/wordpress_nix_tools
          git-sources: Avunu/python-devops-nix
          override: ${{ inputs.wordpress-nix-override && format('{0}/py/wordpress_nix_tools', inputs.wordpress-nix-override) || '' }}

      # The App's token when the caller passes one: the update it makes is a push that starts
      # CI. A merge that brings .github/workflows/ changes in needs Workflows write, so the
      # token asks for it first and, from an App without it, falls back to Contents and Pull
      # requests. Else GITHUB_TOKEN, and CI is dispatched on each new head.
      - id: app
        name: Whether the caller passes the GitHub App
        env:
          ENABLED: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - if: steps.app.outputs.enabled == 'true'
        id: app-token-workflows
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - if: steps.app.outputs.enabled == 'true' && steps.app-token-workflows.outcome != 'success'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Bring bot PRs that are behind up to date
        env:
          GH_TOKEN: ${{ steps.app-token-workflows.outputs.token || steps.app-token.outputs.token || github.token }}
          APP: ${{ steps.app-token-workflows.outputs.token != '' || steps.app-token.outputs.token != '' }}
          INTEGRATION: ${{ inputs.integration-branch }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --integration "$INTEGRATION")
          if [ "$APP" != true ]; then
            # A GITHUB_TOKEN update raises no event.
            args+=(--dispatch-ci)
          fi
          wordpress-nix ci update-branches "${args[@]}"
