# wordpress-nix's built-in profile `recommended@1.0`. standards-core requires one; a
# wordpress-nix checkout is always a site, so it is `deployment@1.0` (which site
# repositories name). Frozen once released.

schema = 1
name = "recommended"
description = "The same modules as deployment@1.0: wordpress-nix's checkouts are sites, which are never released."

[dev-shell]
enable = true

[editorconfig]
enable = true

[lint]
enable = true

[commits]
enable = true
allowed-types = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "style", "test"]
subject-length = 100
allow-stacked = true
pr-allowed-bases = []

[releases]
enable = false

[dependabot]
enable = true
timezone = "America/New_York"
open-pull-requests-limit = 10
auto-merge = true
auto-merge-policy = "decision-table"
update-branches = true

[ci]
enable = true
runs-on = ["self-hosted", "nixos"]
smoke-runs-on = ["self-hosted", "linux", "x64", "kvm"]
nix-cache-variable = "WORDPRESS_NIX_CACHE"
github-app = { app-id = "APP_ID", private-key = "APP_PRIVATE_KEY" }
schedules = {}

[site]
enable = true
local-upload-prefixes = ["cwicly", "fonts", "wpcodebox", "fluentform"]

[repo-policy]
enable = true
required-approvals = 0
merge-methods = ["squash"]
