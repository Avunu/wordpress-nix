# wordpress-nix:managed — generated by wordpress-nix (`wordpress-init --sync`); edit only inside the wordpress-nix:local region.
# Checks with no tool to fetch: prek (or pre-commit) runs them from the site's dev shell,
# which has php and committed. Committed premium code under web/app/ is a vendor's, kept
# byte for byte: only the syntax check reads it.
repos:
  - repo: local
    hooks:
      - id: no-dumps-or-secrets
        name: no database dumps, Composer credentials or .env files in git
        language: fail
        entry: database dumps, auth.json and .env files never go into a site repository
        files: '(\.sql(\.gz)?|(^|/)auth\.json|(^|/)\.env(\.[^/]*)?)$'
        exclude: '(^|/)\.env\.example$'
      - id: php-syntax
        name: php -l on committed PHP
        language: system
        entry: sh -c 'for f; do php -l "$f" > /dev/null || exit 1; done' --
        files: '\.php$'
        exclude: '^web/wp/'
      - id: committed
        name: conventional commit message (committed.toml)
        language: system
        entry: committed --commit-file
        stages: [commit-msg]
      # wordpress-nix:local-begin hooks
      # wordpress-nix:local-end hooks
