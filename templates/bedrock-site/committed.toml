# wordpress-nix:managed — generated by wordpress-nix (`wordpress-init --sync`); edit only inside the wordpress-nix:local region.
# Conventional commits: a site is deployed from main, never released, so the type
# says what changed, not what version follows.
style = "conventional"
allowed_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]
subject_length = 100
line_length = 0
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = false
no_wip = true
no_fixup = true
merge_commit = false
# wordpress-nix:local-begin committed
# wordpress-nix:local-end committed
